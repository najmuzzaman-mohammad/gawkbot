# XcodeGen spec for the gawkbot iOS app. Regenerate the project with
# `xcodegen generate` from this directory; the .xcodeproj is not committed.
name: Gawkbot
options:
  bundleIdPrefix: bot.gawk
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
packages:
  GawkbotKit:
    path: GawkbotKit
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_ALLOWED: "NO"
    GENERATE_INFOPLIST_FILE: "YES"
    INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_NSCameraUsageDescription: "Scan the pairing code shown in your office's Access & Health page."
    INFOPLIST_KEY_CFBundleDisplayName: gawkbot
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
targets:
  Gawkbot:
    type: application
    platform: iOS
    sources:
      - path: Gawkbot
    dependencies:
      - package: GawkbotKit
    info:
      path: Gawkbot/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: bot.gawk.pair
            CFBundleURLSchemes: [gawkbot]
        NSCameraUsageDescription: "Scan the pairing code shown in your office's Access & Health page."
        UILaunchScreen: {}
        NSAppTransportSecurity:
          # Offices run over http on a LAN or a Tailscale address; anything
          # public must be https (Pairing.make refuses cleartext otherwise).
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: bot.gawk.ios
        TARGETED_DEVICE_FAMILY: "1"
