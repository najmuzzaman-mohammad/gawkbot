name: Release drift check

# Catches the #350 class of bug: a release ships across some distribution
# surfaces but stalls on others (the original incident was every Release
# workflow run since v0.79.3 stuck on a GitHub Environment gate, leaving
# the published package 13 tags behind git). Without this monitor the
# divergence is invisible until a user reports a downgrade prompt.
#
# Surfaces compared:
#   1. Latest semver tag on origin/main      (git source of truth)
#   2. Latest GitHub Release `tag_name`      (goreleaser shipped tarballs)
#   3. The Mac app installer alias on a recent GitHub Release (the asset
#      gawk.bot/download.html resolves; appended by desktop-release.yml)
#
# The npm package is retired, so there is no registry or `npx` surface to
# compare any more. Any divergence between the surfaces above is a bug —
# either a workflow stalled or a desktop build failed. Fail loud, link to
# the divergent surface, let the team triage.

on:
  schedule:
    # Daily at 14:00 UTC — well after the typical release window so a
    # fresh release has time to propagate through every surface
    # before the check runs. Cron is approximate; allow ~15min jitter.
    - cron: "0 14 * * *"
  workflow_dispatch:
  # Also run after every Release workflow run (success or failure) so a
  # stuck env gate or partial publish surfaces in minutes, not 24 hours.
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: release-drift
  cancel-in-progress: false

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
        with:
          # Need full tag history to resolve the latest semver tag locally.
          # `gh api ... /git/refs/tags` would work too but pulls the whole
          # ref list over the network and depends on pagination — checkout
          # with fetch-depth:0 is simpler and the tag list is bounded.
          fetch-depth: 0

      - name: Compare distribution surfaces
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # --- 1. Latest git tag on the default branch ---
          # `--merged origin/main` filters out stray tags on side branches
          # so a partial release tag pushed to a feature branch doesn't
          # mask drift on the real release line.
          # awk, not `grep | head`: under `set -o pipefail` head exits after the
          # first line, grep dies writing to the closed pipe, and its exit 2
          # ("write error: Broken pipe") fails the whole step BEFORE any drift
          # is evaluated. It is a race on the pipe buffer, so it passed for
          # years and became reliable as the tag list grew past ~500 — this
          # guard had stopped checking anything and was simply red, which is
          # indistinguishable from the drift it exists to report. awk exits
          # itself, so nothing writes to a closed pipe.
          git_tag=$(git tag --merged origin/main --sort=-v:refname | awk '/^v[0-9]/{print; exit}')
          if [ -z "$git_tag" ]; then
            echo "::error::no v* tags found on origin/main"
            exit 1
          fi
          git_version=${git_tag#v}
          echo "git tag        = $git_tag"

          # --- 2. Latest GitHub Release ---
          # Use the `releases/latest` endpoint (not `releases?per_page=1`):
          # `latest` filters out drafts and pre-releases, which is what
          # users actually install. A drafted-but-never-published release
          # SHOULD show as drift here.
          gh_tag=$(gh api repos/${{ github.repository }}/releases/latest --jq .tag_name)
          gh_version=${gh_tag#v}
          echo "GitHub release = $gh_tag"

          # --- Divergence check ---
          # git ahead of GitHub → goreleaser/release.yml didn't run for the
          # latest tag.
          if [ "$git_version" != "$gh_version" ]; then
            echo "::error::git tag ($git_tag) is ahead of GitHub Release ($gh_tag)"
            echo "::error::release.yml may be stuck or never ran for this tag"
            echo "::error::check: gh run list --workflow=release.yml --limit=5"
            exit 1
          fi
          echo "git tag and GitHub Release agree at v$git_version. ✓"

      - name: Verify desktop installer aliases are downloadable
        # The /download.html page resolves its macOS/Windows buttons to the
        # newest release that actually carries these version-less aliases.
        # They're appended to each v* release by desktop-release.yml, whose
        # build can fail on its own (runner disk space, a flaky CDN). When the
        # LATEST release's desktop build fails, `releases/latest/download/<alias>`
        # 404s — the original incident. The page now self-heals by falling back
        # to an older release that still has the alias, so the only true outage
        # is when NO recent release carries it at all: fail loud there. When
        # merely the latest release is missing it, warn (don't fail) — the page
        # still works, but a desktop build needs a re-run.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          aliases="WUPHF-mac.dmg WUPHF-windows-setup.exe"

          # Asset names across recent published (non-draft) releases, and on the
          # specific release users land on via releases/latest.
          all_assets=$(gh api 'repos/${{ github.repository }}/releases?per_page=30' \
            --jq '[.[] | select(.draft | not) | .assets[].name] | unique | .[]')
          latest_assets=$(gh api repos/${{ github.repository }}/releases/latest \
            --jq '.assets[].name')
          latest_tag=$(gh api repos/${{ github.repository }}/releases/latest --jq .tag_name)

          fail=0
          for a in $aliases; do
            if ! grep -qx "$a" <<<"$all_assets"; then
              echo "::error::no published release carries '$a' — /download.html has nothing to link to"
              echo "::error::check: gh run list --workflow=desktop-release.yml --limit=5"
              fail=1
            elif ! grep -qx "$a" <<<"$latest_assets"; then
              echo "::warning::latest release ($latest_tag) is missing '$a' — its desktop build failed; /download.html falls back to an older release"
              echo "::warning::re-run: gh workflow run desktop-release.yml --ref $latest_tag -f version=${latest_tag#v}"
            fi
          done
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "Desktop installer aliases are downloadable. ✓"
