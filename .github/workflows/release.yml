name: Release

on:
  push:
    tags:
      - "v*"
  # workflow_dispatch lets auto-release.yml trigger this workflow via
  # `gh workflow run release.yml --ref <tag>`. A push tag event created with
  # GITHUB_TOKEN does not fire other workflows, but workflow_dispatch does.
  workflow_dispatch:

# Default to least-privilege; the release job below adds only what it
# actually needs (contents: write, to upload release assets).
permissions:
  contents: read

# Don't cancel an in-flight release: a partially-finished goreleaser leaves
# orphan release assets. Two concurrent releases for the same tag can't be
# valid anyway — tags are immutable; the second invocation has nothing new
# to ship.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # No environment gate: tags pushed to this repo are intended releases,
    # full stop. An earlier env gate paused every run waiting on a human
    # approval and the queue stalled for ~13 tags (#350) before anyone
    # noticed the banner was advertising stale versions.
    #
    # The defensive value the gate was supposed to provide (catch an
    # unintended release) is covered by these layered controls, accurate
    # to today's setup:
    #
    #   1. Branch-protected `main` (1 review, dismiss-stale, conversation
    #      resolution). All commits land via reviewed PR. `auto-release.yml`
    #      then creates `v*` tags from those reviewed commits — so the
    #      invariant is "every tag points at a reviewed commit", NOT
    #      "every tag itself was reviewed".
    #   2. release-drift.yml runs daily + after every Release completion,
    #      screaming if the git tag and the GitHub Release ever diverge, or
    #      if no recent release carries the Mac app installer.
    #
    # Distribution is the GitHub Release itself: goreleaser uploads the CLI
    # binaries here, and desktop-release.yml appends the Mac app (.dmg) that
    # gawk.bot/download.html resolves. There is no npm publish any more; the
    # npm package is retired and the Mac app is how people get gawkbot.
    #
    # If we ever need a preventive humans-in-the-loop step again, prefer
    # a tag-name convention (e.g. `vX.Y.Z-rc.N` skips `--tag latest`) or
    # a tag ruleset over a silent env gate that nobody monitors.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify releasable tree
        run: |
          missing=0
          for path in go.mod cmd/wuphf/main.go web/bun.lock; do
            if [ ! -e "$path" ]; then
              echo "::error::missing ${path}; refusing to build or publish this tag"
              missing=1
            fi
          done
          test "$missing" -eq 0

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # ratchet:actions/setup-go@v6
        with:
          go-version-file: go.mod

      # Pin to full SHA: third-party action, runs with write access to
      # contents (release upload). Same SHA is reused across all web-facing
      # workflows — keep them in sync.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.13"

      - name: Build React frontend
        working-directory: web
        # Vite inlines import.meta.env.VITE_* into the bundle at build time, so
        # the PostHog project key is baked into every published binary HERE,
        # once, for the whole release. When POSTHOG_PROJECT_KEY is unset (forks,
        # source builds), the value is empty and onboarding analytics stay
        # dormant (see web/src/lib/analytics.ts getConfig). The phc_ project key
        # is write-only and safe to ship in client code; the host falls back to
        # us.i.posthog.com when POSTHOG_HOST is not set.
        env:
          VITE_PUBLIC_POSTHOG_KEY: ${{ secrets.POSTHOG_PROJECT_KEY }}
          VITE_PUBLIC_POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
        run: |
          bun install --frozen-lockfile
          bun run build

      - run: go test ./...

      - uses: goreleaser/goreleaser-action@1a80836c5c9d9e5755a25cb59ec6f45a3b5f41a8 # ratchet:goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
